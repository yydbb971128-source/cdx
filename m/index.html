<script>
(function(){
  var pages = document.getElementById('mPages');
  var dots  = document.querySelectorAll('.m-dot');
  var arrow = document.getElementById('mArrow');
  var total = dots.length;
  var cur   = 0;

  function goTo(i) {
    if (i < 0 || i >= total) return;
    cur = i;
    pages.style.transform = 'translateY(-' + (cur * 100) + 'vh)';
    dots.forEach(function(d, idx) { d.classList.toggle('active', idx === cur); });
    arrow.style.opacity = cur === total - 1 ? '0' : '1';
  }

  arrow.addEventListener('click', function() { goTo(cur + 1); });

  var startY = 0, moved = false;
  pages.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
    moved = false;
  }, { passive: true });
  pages.addEventListener('touchmove', function(e) {
    moved = true;
  }, { passive: true });
  pages.addEventListener('touchend', function(e) {
    if (!moved) return;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dy) > 50) {
      goTo(cur + (dy < 0 ? 1 : -1));
    }
  });

  dots.forEach(function(d, i) {
    d.addEventListener('click', function() { goTo(i); });
  });

  // 汉堡菜单
  var btn    = document.getElementById('mHamburger');
  var drawer = document.getElementById('mDrawer');
  var mask   = document.getElementById('mDrawerMask');
  function toggle() {
    btn.classList.toggle('open');
    drawer.classList.toggle('open');
    mask.classList.toggle('open');
  }
  btn.addEventListener('click', toggle);
  mask.addEventListener('click', toggle);
})();
</script>
